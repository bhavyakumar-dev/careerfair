name = "open-mic-career-lab"
pages_build_output_dir = "."
compatibility_date = "2026-10-25"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "open-mic-career-lab"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "open-mic-private-media"
